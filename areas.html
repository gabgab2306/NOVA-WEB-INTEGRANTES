<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA · Áreas</title><link rel="stylesheet" href="./styles.css"></head><body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./portal.js"></script><script>boot("areas","Áreas","PARTICIPACIÓN",async()=>{const r=await db.from("integrante_areas").select("*").eq("integrante_id",member.id).order("area"),a=r.data||[];document.querySelector(".page").innerHTML='<section class="page-head"><p class="kicker">MIS ÁREAS</p><h1>Tu espacio de participación.</h1><p>Consulta tus áreas y asignaciones dentro del club.</p></section><div class="module-grid">'+(a.map(x=>'<article class="module"><span class="module-icon">✦</span><p class="kicker">ÁREA ACTIVA</p><h2>'+esc(x.area)+'</h2><p>'+esc(x.detalle||"Participación activa dentro de NOVA.")+'</p><div class="module-data"><small>Asignación activa</small></div></article>').join("")||empty("Directiva todavía no te ha asignado un área."))+'<article class="module info"><p class="kicker">ESTRUCTURA NOVA</p><h2>Artística · Oratoria & Debate · Logística & Protocolo · Innovación & Proyectos</h2><p>Tu participación puede crecer y cambiar con el club.</p></article></div>'})</script></body></html>
