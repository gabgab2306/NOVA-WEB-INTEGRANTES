<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA · Áreas</title><link rel="stylesheet" href="./styles.css"></head><body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./portal.js"></script><script>
boot("areas","Áreas","PARTICIPACIÓN",async()=>{
 const {data}=await db.from("integrante_areas").select("*").eq("integrante_id",member.id).order("area");const areas=data||[];
 document.querySelector("#page").innerHTML='<section class="page-intro"><p class="eyebrow">MIS ÁREAS</p><h1>Tu participación.</h1><p>Consulta las áreas y asignaciones que la Directiva ha definido para ti.</p></section><div class="area-grid">'+(areas.map(a=>'<article class="area-card"><span class="area-mark">✦</span><p class="eyebrow">ÁREA ACTIVA</p><h2>'+esc(a.area)+'</h2><p>'+esc(a.detalle||"Participación activa dentro de NOVA.")+'</p><small>Asignación activa</small></article>').join("")||empty("Directiva todavía no te ha asignado un área."))+'</div>';
});
</script></body></html>
