<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA · Inicio</title><link rel="stylesheet" href="./styles.css"></head><body><div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./portal.js"></script><script>boot("home","Inicio","PORTAL DEL INTEGRANTE",async()=>{const h=await db.from("casas").select("*").order("puntos",{ascending:false}),a=await db.from("actividades").select("*").order("fecha",{ascending:true}),houses=h.data||[];const mine=houses.find(x=>x.id===member.casa_id);document.querySelector(".page").innerHTML='<section class="home-hero"><div><p class="kicker">ESPACIO DEL INTEGRANTE</p><h1>Bienvenida, <span>'+esc(member.nombre_completo.split(" ")[0])+".</span></h1><p>Este es tu espacio personal dentro de NOVA.</p></div><div class="house-badge"><span>'+((meta[mine?.nombre]||["✦"])[0])+'</span><small>'+ (mine?"TU CASA":"CASA")+'</small><b>'+esc(mine?.nombre||"Asignación pendiente")+'</b></div></section><section class="house-board"><div class="section-title"><div><p class="kicker">LAS CINCO CASAS</p><h2>El tablero está vivo.</h2></div><span class="live">● EN TIEMPO REAL</span></div><div class="house-board-grid">'+houses.map((x,i)=>{const m=meta[x.nombre]||["✦","#aaa"];return '<article class="house-tile '+(x.id===member.casa_id?"mine":"")+'" style="--house-color:'+m[1]+'"><small>#'+(i+1)+'</small><div class="house-emblem">'+m[0]+'</div><h3>'+esc(x.nombre)+'</h3><strong>'+(x.puntos||0)+'<em> PTS</em></strong></article>'}).join("")+"</div></section><section class=\"next\"><p class=\"kicker\">PRÓXIMAMENTE</p><h2>Agenda NOVA</h2><div class=\"next-list\">"+((a.data||[]).slice(0,3).map(x=>'<div><b>'+esc(x.nombre)+'</b><small>'+esc(x.fecha||"Fecha por anunciar")+' · '+esc(x.tipo||"Actividad")+"</small></div>").join("")||empty("No hay actividades publicadas todavía."))+"</div></section>";db.channel("member-houses").on("postgres_changes",{event:"UPDATE",schema:"public",table:"casas"},()=>location.reload()).subscribe()})</script></body></html>
