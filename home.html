<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA · Inicio</title><link rel="stylesheet" href="./styles.css"></head><body><div id="preload-screen" class="portal-loading"><div class="portal-loading-mark">N</div><p class="eyebrow">NOVA · PORTAL DEL INTEGRANTE</p><h1>Preparando tu espacio…</h1><p id="preload-status"><span>●</span>Conectando con NOVA</p></div><script>window.addEventListener("error",function(e){var el=document.querySelector("#preload-status");if(el)el.innerHTML="<span>●</span>Error al iniciar: "+String(e.message||"script")});window.addEventListener("unhandledrejection",function(e){var el=document.querySelector("#preload-status");if(el)el.innerHTML="<span>●</span>Error al iniciar: "+String(e.reason?.message||"promesa")});</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./portal.js"></script><script>
if(typeof boot!=="function"){document.querySelector("#preload-status").innerHTML='<span>●</span>No se pudo cargar el motor del portal. Recarga la página.';throw new Error("NOVA portal.js no cargó")}
boot("home","Inicio","PORTAL DEL INTEGRANTE",async()=>{
 const page=document.querySelector("#page");
 page.innerHTML='<section class="welcome"><div><p class="eyebrow">ESPACIO DEL INTEGRANTE</p><h1>Bienvenida, <strong>'+esc(firstName(member.nombre_completo))+'.</strong></h1><p>Tu lugar, tu voz y tu casa dentro de NOVA.</p><a class="home-forum-link" href="./community.html">Entrar a la plaza NOVA <span>↗</span></a></div><div class="my-house" id="homeMyHouse" style="--house:#d7ae52"><span>✦</span><small>TU CASA ASIGNADA</small><b>Consultando…</b><em>La asignación la gestiona Directiva</em></div></section>
 <section class="section"><div class="section-head"><div><p class="eyebrow">LAS CINCO CASAS</p><h2>El tablero de NOVA</h2></div><span class="live">● EN TIEMPO REAL</span></div><div class="house-chart"><div class="chart-axis"><span>PTS</span><i></i></div><div class="chart-bars" id="houseBoard"></div></div></section>
 <section class="point-feed-section"><div class="section-head"><div><p class="eyebrow">MOVIMIENTOS RECIENTES</p><h2>La historia de los puntos.</h2></div><span class="live">✦ ACTUALIZADO EN VIVO</span></div><div id="pointActivity" class="point-activity-list"><div class="point-empty">Cargando movimientos…</div></div></section>';
 async function refreshHouses(){
  portalStatus("Consultando las cinco casas…");
  const {data,error}=await db.from("casas").select("*").order("puntos",{ascending:false});if(error){console.error("NOVA casas:",error);throw new Error("No se pudieron consultar las casas: "+error.message)}
  const list=data||[],mine=list.find(h=>h.id===member.casa_id),hm=houseMeta[mine?.nombre]||{symbol:"✦",color:"#d7ae52"};
  const badge=document.querySelector("#homeMyHouse");badge.style.setProperty("--house",hm.color);badge.innerHTML='<span>'+hm.symbol+'</span><small>TU CASA ASIGNADA</small><b>'+esc(mine?.nombre||"Asignación pendiente")+'</b><em>Tu casa la define Directiva</em>';
  document.querySelector("#houseBoard").innerHTML=list.map((h,i)=>{const m=houseMeta[h.nombre]||{symbol:"✦",color:"#aaa"};return '<article class="house '+(h.id===member.casa_id?"mine":"")+'" style="--house:'+m.color+'"><small>#'+(i+1)+'</small><span class="house-symbol">'+m.symbol+'</span><h3>'+esc(h.nombre)+'</h3><strong>'+Number(h.puntos||0)+' <em>PTS</em></strong>'+(h.id===member.casa_id?'<small class="mine-label">TU CASA</small>':'')+'</article>'}).join("")||'<div class="point-empty">Las casas todavía no están disponibles.</div>';
 }
 async function refreshMovements(){
  portalStatus("Consultando movimientos de puntos…");
  const {data,error}=await db.from("movimientos_puntos").select("id,casa_id,cantidad,fecha,nombre_directiva").order("fecha",{ascending:false}).limit(10);
  const list=document.querySelector("#pointActivity");if(error){list.innerHTML='<div class="point-empty">No pudimos cargar los movimientos.</div>';return}
  const {data:houses}=await db.from("casas").select("id,nombre");const names=new Map((houses||[]).map(h=>[h.id,h.nombre]));
  list.innerHTML=(data||[]).length?(data||[]).map(m=>{const hname=names.get(m.casa_id)||"Casa NOVA",meta=houseMeta[hname]||{symbol:"✦",color:"#d7ae52"};return '<article class="point-movement" style="--house:'+meta.color+'"><div class="movement-emblem">'+meta.symbol+'</div><div class="movement-copy"><b>'+esc(hname)+'</b><small>'+esc(m.nombre_directiva||"Directiva NOVA")+' · '+(m.fecha?new Date(m.fecha).toLocaleString("es-DO",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"Fecha no disponible")+'</small></div><strong class="'+(Number(m.cantidad)>=0?"positive":"negative")+'">'+(Number(m.cantidad)>0?"+":"")+Number(m.cantidad)+' <small>PTS</small></strong></article>'}).join(""):'<div class="point-empty">Todavía no hay movimientos registrados. Cada punto que sume Directiva aparecerá aquí.</div>';
 }
 await Promise.all([refreshHouses(),refreshMovements()]);
 portalStatus("Inicio cargado correctamente.");
 db.channel("nova-house-live").on("postgres_changes",{event:"*",schema:"public",table:"casas"},()=>refreshHouses()).on("postgres_changes",{event:"*",schema:"public",table:"movimientos_puntos"},()=>{refreshMovements();refreshHouses()}).subscribe();
});
</script></body></html>
