<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA · Inicio</title><link rel="stylesheet" href="./styles.css"></head><body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./portal.js"></script><script>
boot("home","Inicio","PORTAL DEL INTEGRANTE",async()=>{
 const [{data:houses},{data:activities}]=await Promise.all([db.from("casas").select("*").order("puntos",{ascending:false}),db.from("actividades").select("*").order("fecha",{ascending:true}).limit(3)]);
 const list=houses||[],mine=list.find(h=>h.id===member.casa_id),hm=houseMeta[mine?.nombre]||{symbol:"✦",color:"#d7ae52"};
 document.querySelector("#page").innerHTML='<section class="welcome"><div><p class="eyebrow">ESPACIO DEL INTEGRANTE</p><h1>Bienvenida, <strong>'+esc(firstName(member.nombre_completo))+'.</strong></h1><p>Tu espacio personal dentro de NOVA.</p></div><div class="my-house" style="--house:'+hm.color+'"><span>'+hm.symbol+'</span><small>TU CASA</small><b>'+esc(mine?.nombre||"Asignación pendiente")+'</b></div></section><section class="section"><div class="section-head"><div><p class="eyebrow">LAS CINCO CASAS</p><h2>El tablero de NOVA</h2></div><span class="live">● EN TIEMPO REAL</span></div><div class="houses">'+(list.map((h,i)=>{const m=houseMeta[h.nombre]||{symbol:"✦",color:"#aaa"};return '<article class="house '+(h.id===member.casa_id?"mine":"")+'" style="--house:'+m.color+'"><small>#'+(i+1)+'</small><span class="house-symbol">'+m.symbol+'</span><h3>'+esc(h.nombre)+'</h3><strong>'+Number(h.puntos||0)+' <em>PTS</em></strong></article>'}).join("")||empty("Las casas todavía no están disponibles."))+'</div></section><section class="upcoming"><div><p class="eyebrow">PRÓXIMAMENTE</p><h2>Agenda NOVA</h2></div><div class="upcoming-list">'+((activities||[]).map(a=>'<a href="./activities.html"><b>'+esc(a.nombre)+'</b><small>'+dateText(a.fecha)+' · '+esc(a.tipo||"Actividad")+'</small></a>').join("")||empty("No hay actividades publicadas todavía."))+'</div></section>';
});
</script></body></html>
