<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA · Actividades</title><link rel="stylesheet" href="./styles.css"></head><body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./portal.js"></script><script>boot("activities","Actividades","CALENDARIO NOVA",async()=>{const r=await db.from("actividades").select("*").order("fecha",{ascending:true}),a=r.data||[];document.querySelector(".page").innerHTML='<section class="page-head"><p class="kicker">CALENDARIO</p><h1>Actividades NOVA</h1><p>Todo lo que viene, reunido en un solo lugar.</p></section><div class="activity-grid full">'+(a.map(x=>'<article class="activity"><span>'+esc(x.tipo||"ACTIVIDAD")+' · '+esc(x.estado||"")+'</span><h2>'+esc(x.nombre)+'</h2><p>'+esc(x.descripcion||"Sin descripción.")+'</p><time>'+esc(x.fecha||"Fecha por anunciar")+"</time></article>").join("")||empty("No hay actividades publicadas todavía."))+"</div>"})</script></body></html>
