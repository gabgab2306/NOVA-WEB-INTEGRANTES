<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA · Actividades</title><link rel="stylesheet" href="./styles.css"></head><body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./portal.js"></script><script>
boot("activities","Actividades","CALENDARIO NOVA",async()=>{
 const {data}=await db.from("actividades").select("*").order("fecha",{ascending:true});const rows=data||[];
 document.querySelector("#page").innerHTML='<section class="page-intro"><p class="eyebrow">CALENDARIO</p><h1>Actividades NOVA.</h1><p>Entrenamientos, reuniones y competencias del club.</p></section><div class="activity-list">'+(rows.map(a=>'<article class="activity-row"><div><span>'+esc(a.tipo||"ACTIVIDAD")+'</span><h2>'+esc(a.nombre)+'</h2><p>'+esc(a.descripcion||"Sin descripción.")+'</p></div><time>'+dateText(a.fecha)+'</time></article>').join("")||empty("No hay actividades publicadas todavía."))+'</div>';
});
</script></body></html>
