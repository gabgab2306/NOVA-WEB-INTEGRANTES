<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA · Logros</title><link rel="stylesheet" href="./styles.css"></head><body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./portal.js"></script><script>
boot("community","Logros","RECONOCIMIENTO",async()=>{
 const {data}=await db.from("evaluaciones").select("*, actividades(nombre)").eq("integrante_id",member.id).order("fecha_evaluacion",{ascending:false});const feedback=data||[];
 const achievements=[["✦","Primera intervención"],["◈","Voz NOVA"],["◇","Delegado NOVA"],["ϟ","Liderazgo"],["⌁","Organizador"]];
 document.querySelector("#page").innerHTML='<section class="page-intro"><p class="eyebrow">FEEDBACK & LOGROS</p><h1>Lo que vas construyendo.</h1><p>Tu recorrido dentro del club, reunido en un solo espacio.</p></section><div class="community-grid"><section class="panel"><p class="eyebrow">FEEDBACK</p><h2>Retroalimentación</h2><div class="list">'+(feedback.map(f=>'<article class="feedback"><b>'+esc(f.actividades?.nombre||"Evaluación NOVA")+'</b><p>'+esc(f.feedback||"Evaluación registrada sin comentario.")+'</p><small>'+esc(f.fecha_evaluacion||"")+'</small></article>').join("")||empty("Aún no tienes feedback publicado."))+'</div></section><section class="panel"><p class="eyebrow">LOGROS</p><h2>Tu vitrina</h2><div class="list">'+achievements.map(a=>'<div class="achievement"><span>'+a[0]+'</span><div><b>'+a[1]+'</b><small>Disponible según tu trayectoria</small></div></div>').join("")+'</div></section></div>';
});
</script></body></html>
