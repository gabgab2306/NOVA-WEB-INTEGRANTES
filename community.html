<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA · Logros</title><link rel="stylesheet" href="./styles.css"></head><body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./portal.js"></script><script>boot("community","Feedback & logros","RECONOCIMIENTO",async()=>{const r=await db.from("evaluaciones").select("*, actividades(nombre)").eq("integrante_id",member.id).order("fecha_evaluacion",{ascending:false}),f=r.data||[],ach=[["✦","Primera intervención"],["◈","Voz NOVA"],["◇","Delegado NOVA"],["ϟ","Liderazgo"],["⌁","Organizador"]];document.querySelector(".page").innerHTML='<section class="page-head"><p class="kicker">FEEDBACK & LOGROS</p><h1>Lo que vas construyendo.</h1><p>Reconocimientos y retroalimentación de tu recorrido.</p></section><div class="community-grid"><section class="section-block"><p class="kicker">FEEDBACK</p><h2>Lo que te han dejado.</h2><div class="feedback-list">'+(f.map(x=>'<article><b>'+esc(x.actividades?.nombre||"Evaluación NOVA")+'</b><p>'+esc(x.feedback||"Evaluación registrada sin comentario.")+'</p><small>'+esc(x.fecha_evaluacion||"")+"</small></article>").join("")||empty("Aún no tienes feedback publicado."))+'</div></section><section class="section-block"><p class="kicker">LOGROS</p><h2>Tu vitrina.</h2><div class="achievement-list">'+ach.map(x=>'<article><span>'+x[0]+'</span><b>'+x[1]+'</b><small>Disponible según tu trayectoria</small></article>').join("")+"</div></section></div>"})</script></body></html>
