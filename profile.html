<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA · Perfil</title><link rel="stylesheet" href="./styles.css"></head><body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./portal.js"></script><script>boot("profile","Perfil","MI ESPACIO",async()=>{const r=await db.from("integrante_areas").select("*").eq("integrante_id",member.id).order("area"),a=r.data||[];document.querySelector(".page").innerHTML='<section class="page-head"><p class="kicker">MI PERFIL</p><h1>'+esc(member.nombre_completo)+'</h1><p>'+esc(member.username?"@"+member.username:"Integrante NOVA")+' · '+esc(member.curso||"")+' '+esc(member.seccion||"")+'</p></section><div class="profile-layout"><article class="profile-panel"><div class="big-avatar">'+member.nombre_completo.split(/\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase()+'</div><h2>'+esc(member.nombre_completo)+'</h2><span>'+esc(member.email||"")+'</span><dl><dt>Teléfono</dt><dd>'+esc(member.telefono||"No registrado")+'</dd><dt>Motivación</dt><dd>'+esc(member.motivacion||"No registrada")+'</dd><dt>Experiencia previa</dt><dd>'+(member.experiencia?"Sí":"No")+"</dd></dl></article><article class=\"profile-panel\"><p class=\"kicker\">ÁREAS</p><h2>Tu trayectoria en NOVA</h2><div class=\"profile-areas\">"+(a.map(x=>'<div><b>'+esc(x.area)+'</b><small>'+esc(x.detalle||"Área activa dentro del club")+"</small></div>").join("")||empty("Todavía no tienes un área asignada."))+"</div></article></div>"})</script></body></html>
