<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA · Perfil</title><link rel="stylesheet" href="./styles.css"></head><body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./portal.js"></script><script>
boot("profile","Perfil","MI ESPACIO",async()=>{
 const {data:areas}=await db.from("integrante_areas").select("*").eq("integrante_id",member.id).order("area");
 const house=(await db.from("casas").select("*").eq("id",member.casa_id).maybeSingle()).data;
 document.querySelector("#page").innerHTML='<section class="page-intro"><p class="eyebrow">MI PERFIL</p><h1>'+esc(member.nombre_completo)+'</h1><p>@'+esc(member.username||"member")+' · '+esc(member.curso||"")+' '+esc(member.seccion||"")+'</p></section><div class="profile-grid"><article class="panel identity"><div class="big-avatar">'+esc(initials(member.nombre_completo))+'</div><p class="eyebrow">INTEGRANTE NOVA</p><h2>'+esc(member.nombre_completo)+'</h2><p class="muted">'+esc(member.email||"")+'</p><dl><div><dt>Teléfono</dt><dd>'+esc(member.telefono||"No registrado")+'</dd></div><div><dt>Motivación</dt><dd>'+esc(member.motivacion||"No registrada")+'</dd></div><div><dt>Experiencia</dt><dd>'+((member.experiencia===true)?"Sí":"No")+'</dd></div><div><dt>Casa</dt><dd>'+esc(house?.nombre||"Pendiente")+'</dd></div></dl></article><article class="panel"><p class="eyebrow">TRAYECTORIA</p><h2>Áreas dentro de NOVA</h2><div class="list">'+((areas||[]).map(a=>'<div class="list-row"><span>✦</span><div><b>'+esc(a.area)+'</b><small>'+esc(a.detalle||"Asignación activa dentro del club.")+'</small></div></div>').join("")||empty("Todavía no tienes un área asignada."))+'</div></article></div>';
});
</script></body></html>
