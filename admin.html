<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA · Acceso Directiva</title><link rel="stylesheet" href="./styles.css"><style>body{display:grid;place-items:center;min-height:100vh}.admin-card{position:relative;z-index:2;width:min(440px,calc(100% - 28px));padding:28px;border:1px solid rgba(54,169,255,.2);border-radius:26px;background:rgba(8,14,24,.94);box-shadow:0 25px 80px #0008}.admin-card h1{font:700 38px "Playfair Display";margin:8px 0}.admin-card h1 span{color:#55b7ff}.admin-card p{color:#8e9bb0;font-size:12px;line-height:1.6}.admin-card form{display:grid;gap:12px;margin-top:20px}.admin-card label{display:grid;gap:6px;font-size:11px;color:#8e9bb0}.admin-card input{width:100%;background:#070d17;border:1px solid rgba(129,161,201,.16);color:white;border-radius:13px;padding:13px;outline:none}.admin-card button{border:0;border-radius:14px;padding:14px;background:linear-gradient(110deg,#188bd5,#d3a744);font-weight:800;cursor:pointer}.msg{min-height:20px;color:#e7c26a;font-size:12px;margin-top:12px}.back{display:block;text-align:center;margin-top:16px;color:#6dbdff;text-decoration:none;font-size:11px}</style></head><body><div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><main class="admin-card"><p class="kicker">NOVA · ACCESO PRIVADO</p><h1>Entrada de <span>Directiva</span></h1><p>Este acceso no crea cuentas de integrantes. Usa directamente las credenciales de tu cuenta administrativa de NOVA.</p><form id="f"><label>Correo administrativo<input id="e" type="email" required autocomplete="email"></label><label>Contraseña<input id="p" type="password" required autocomplete="current-password"></label><button>Entrar al panel administrativo →</button></form><div id="m" class="msg"></div><a class="back" href="./">← Volver a Integrantes</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://hogbjrbaeedlyglegjle.supabase.co","sb_publishable_NWG23rPztabdaFhEyNtN5w_rrCeMTC5");const m=document.querySelector("#m");document.querySelector("#f").addEventListener("submit",async e=>{e.preventDefault();m.textContent="Verificando acceso…";const {error}=await db.auth.signInWithPassword({email:document.querySelector("#e").value.trim(),password:document.querySelector("#p").value});if(error){m.textContent="Correo o contraseña incorrectos.";return}const {data:ok,error:check}=await db.rpc("is_directiva");if(check||!ok){await db.auth.signOut();m.textContent="Este usuario no tiene autorización de Directiva.";return}location.href="https://nova-web-admin-pkqhyalat-gabriela-f.vercel.app/"});</script></body></html>
