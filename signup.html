<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA · Crear cuenta</title>
<link rel="stylesheet" href="./styles.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#050914">
</head>
<body>
<div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
<section class="auth-view signup-view">
<div>
<a class="back-link" href="./index.html">← Volver al acceso</a>
<div class="brand-mark"><span>N</span><i>O</i><b>V</b><em>A</em></div>
<p class="kicker">NOVA · CUENTA DE INTEGRANTE</p>
<h1>Tu acceso a<br><strong>NOVA</strong></h1>
<p class="lead">Crea tu cuenta usando exactamente el correo con el que fuiste aprobado por la Directiva.</p>
<div class="auth-card signup-card">
<form id="signupForm">
<label>Correo electrónico<input id="email" type="email" required autocomplete="email" placeholder="correo.aprobado@email.com"></label>
<div class="form-grid">
<label>Contraseña<input id="password" type="password" required minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres"></label>
<label>Confirmar contraseña<input id="passwordConfirm" type="password" required minlength="8" autocomplete="new-password" placeholder="Repite tu contraseña"></label>
</div>
<p class="auth-hint">Tu correo debe coincidir con el que aparece en tu registro aprobado. La cuenta queda vinculada automáticamente a tu ficha.</p>
<button class="primary-btn" type="submit">Crear mi cuenta <span>→</span></button>
</form>
<p id="signupMessage" class="auth-message"></p>
</div>
</div>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient("https://hogbjrbaeedlyglegjle.supabase.co","sb_publishable_NWG23rPztabdaFhEyNtN5w_rrCeMTC5",{auth:{persistSession:true,autoRefreshToken:true,storage:window.localStorage}});
const form=document.querySelector("#signupForm"),msg=document.querySelector("#signupMessage");
form.onsubmit=async e=>{
 e.preventDefault();
 const email=document.querySelector("#email").value.trim().toLowerCase();
 const password=document.querySelector("#password").value;
 const confirm=document.querySelector("#passwordConfirm").value;
 if(password.length<8){msg.textContent="La contraseña debe tener al menos 8 caracteres.";return}
 if(password!==confirm){msg.textContent="Las contraseñas no coinciden.";return}
 const button=form.querySelector("button[type=submit]");button.disabled=true;msg.textContent="Verificando tu aprobación y creando la cuenta…";
 try{
   const res=await fetch("https://hogbjrbaeedlyglegjle.supabase.co/functions/v1/create-integrante-account",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});
   let data={};try{data=await res.json()}catch{}
   if(!res.ok){msg.textContent=data.error||"No pudimos crear la cuenta.";button.disabled=false;return}
   msg.textContent="Cuenta creada. Entrando a NOVA…";
   const {error}=await db.auth.signInWithPassword({email,password});
   if(error){msg.textContent="La cuenta fue creada. Vuelve al acceso para iniciar sesión.";button.disabled=false;return}
   window.location.replace("./home.html");
 }catch(error){msg.textContent="No pudimos conectar con NOVA. Intenta nuevamente.";button.disabled=false}
};
</script>
</body>
</html>
